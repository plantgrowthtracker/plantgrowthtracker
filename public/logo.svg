<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Badge background -->
  <circle cx="60" cy="60" r="58" fill="#FBF3E3" stroke="#E4DCC7" stroke-width="2"/>

  <!-- Dashed baseline (the "track") -->
  <line x1="22" y1="92" x2="98" y2="92" stroke="#C9BE9C" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>

  <!-- Ascending growth line (stem doubles as a growth-chart line) -->
  <path d="M28 88 L45 70 L62 50 L80 30"
        fill="none" stroke="#1E3A2B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Leaf 1 (smallest, earliest growth stage) -->
  <path d="M45 70C40 68 36 64 37 58C43 58 47 62 47 68Z" fill="#9CB39A" stroke="#1E3A2B" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Leaf 2 (mid growth stage) -->
  <path d="M62 50C56 48 51 43 52 35C60 35 65 40 65 48Z" fill="#7CA184" stroke="#1E3A2B" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Leaf 3 (largest, most recent stage) -->
  <path d="M80 30C73 28 66 22 67 12C77 12 83 19 83 29Z" fill="#4C7A5E" stroke="#1E3A2B" stroke-width="2" stroke-linejoin="round"/>

  <!-- Marigold growth marker at the latest data point -->
  <circle cx="80" cy="30" r="6.5" fill="#E8A23D" stroke="#C77E1F" stroke-width="1.5"/>
</svg>
